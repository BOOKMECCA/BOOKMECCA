<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKMECCA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #F6F6F6;
            font-family: 'Inter', sans-serif;
        }

        .container {
            max-width: 100%;
            padding: 0 18px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            margin-top: 20px;
        }

        .logo {
            width: 92px;
            height: 49px;
            object-fit: contain;
        }

        /* 검색창 래퍼 (추가) */
        .search-wrap {
            position: relative;
            width: 176px;
            margin-top: 18px;
        }

        /* 돋보기 아이콘 (추가) */
        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            pointer-events: none;
        }

        .search-input {
            width: 176px;
            height: 29px;
            padding: 4px 8px 4px 32px; /* 아이콘 공간 */
            border: 1px solid #B6D23C;
            border-radius: 14.5px;
            background-color: #FFFFFF;
            font-size: 14px;
            box-sizing: border-box;
        }

        .search-input:focus {
        outline: none;
        border-color: #B6D23C;
        }


        .recommend-section {
            margin-top: 20px;
        }

        .recommend-section h2 {
            font-size: 30px;
            font-weight: 500;
            margin: 0 0 8px 0;
        }

        .recommend-section p {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            margin: 0;
        }

        .filter-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            position: relative;
        }

        .filter {
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .filter img.arrow {
            width: 12px;
            height: 12px;
            margin-left: 4px;
            position: relative;
            top: 1px;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 4px;
            background-color: #FFFFFF;
            border: 1px solid #DFDFDF;
            border-radius: 4px;
            z-index: 10;
        }

        .dropdown div {
            padding: 8px 13px;
            font-size: 11px;
            font-weight: 400;
            text-align: center;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .dropdown div.selected {
            color: #000000;
        }

        .dropdown div.dimmed {
            color: #B0B0B0;
        }

        .tab-container {
            margin-top: 14px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-container::-webkit-scrollbar {
            display: none;
        }

        .tab-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .tab {
        height: 32px;
        padding: 0 15px;          /* 좌우 여백으로 크기 조절 */
        border-radius: 16px;
        background-color: #E8E8E8;
        color: #000000;
        font-size: 14px;
        font-weight: 400;
        display: inline-flex;     /* 내용 크기에 맞게 */
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        }

        .tab.active {
            background-color: #36A5FF;
            color: #FFFFFF;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 720px;
                margin: 0 auto;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 960px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <!-- 헤더 -->
    <header>
        <a href="index.html">
            <img src="http://mecca01.hgodo.com/goods/bookmecca_logo.png" alt="로고" class="logo">
        </a>

        <!--  검색창 + 아이콘  -->
        <div class="search-wrap">
            <img src="search.svg" class="search-icon" alt="검색"> <!-- 나중에 이미지 주소 넣으면 됨 -->
            <input type="text" class="search-input">
        </div>        
    </header>

    <div class="recommend-section">
        <h2>추천 도서 리스트</h2>
        <p>
            미국, 영국 출판사에서 수입한 어린이 영어원서<br>
            신간 소개 및 유교전, 국제학교 베스트셀러 도서
        </p>

        <div class="filter-container">
            <div class="filter" onclick="toggleDropdown()">
                <span id="selectedFilter">AR레벨</span>
                <img id="arrowImg" class="arrow" src="arrow_down.svg" alt="▼">
            </div>
            <div class="dropdown" id="dropdown">
                <div onclick="selectFilter(this)">전체</div>
                <div onclick="selectFilter(this)">1점대</div>
                <div onclick="selectFilter(this)">2점대</div>
                <div onclick="selectFilter(this)">3점대</div>
                <div onclick="selectFilter(this)">4점대</div>
                <div onclick="selectFilter(this)">5점대</div>
                <div onclick="selectFilter(this)">6점이상</div>
            </div>
        </div>

        <div class="tab-container">
            <div class="tab active">대표도서</div>
            <div class="tab">리더스</div>
            <div class="tab">그래픽노블</div>
            <div class="tab">챕터북</div>
            <div class="tab">스토리북</div>
            <div class="tab">전체</div>
        </div>
    </div>

    <main>
        <p>콘텐츠</p>
    </main>
</div>

<script>
    const dropdown = document.getElementById('dropdown');
    const selectedFilter = document.getElementById('selectedFilter');
    const arrowImg = document.getElementById('arrowImg');

    let currentSelected = null;

    function toggleDropdown() {
        const options = dropdown.querySelectorAll('div');
        options.forEach(item => {
            item.classList.remove('selected', 'dimmed');

            if (currentSelected === null) {
                item.classList.add('dimmed');
            } else {
                if (item.textContent === currentSelected) {
                    item.classList.add('selected');
                } else {
                    item.classList.add('dimmed');
                }
            }
        });

        if (dropdown.style.display === 'block') {
            dropdown.style.display = 'none';
            arrowImg.src = 'arrow_down.svg'; // 닫혔을 때 아래 화살표
        } else {
            dropdown.style.display = 'block';
            arrowImg.src = 'arrow_up.svg';   // 열렸을 때 위 화살표
        }
    }

    function selectFilter(option) {
        currentSelected = option.textContent;
        selectedFilter.textContent = currentSelected;
        dropdown.style.display = 'none';
        arrowImg.src = 'arrow_down.svg'; // 선택하면 닫히니까 아래 화살표로
    }

    window.addEventListener('click', (e) => {
        if (!e.target.closest('.filter-container')) {
            dropdown.style.display = 'none';
            arrowImg.src = 'arrow_down.svg'; // 외부 클릭 시 닫히면 아래 화살표
        }
    });

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
        });
    });
</script>


</body>
</html>
