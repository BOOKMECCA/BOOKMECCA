<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKMECCA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #F6F6F6;
            font-family: 'Inter', sans-serif;
        }

        .container {
            max-width: 100%;
            width: 100%; 
            padding: 0 18px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            margin-top: 20px;
        }

        .logo {
            width: 92px;
            height: 49px;
            object-fit: contain;
        }

        .search-wrap {
            position: relative;
            width: 176px;
            margin-top: 18px;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            pointer-events: none;
        }

        .search-input {
            width: 176px;
            height: 29px;
            padding: 4px 8px 4px 32px;
            border: 1px solid #B6D23C;
            border-radius: 14.5px;
            background-color: #FFFFFF;
            font-size: 14px;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #B6D23C;
        }

        .recommend-section {
            margin-top: 20px;
        }

        .recommend-section h2 {
            font-size: 30px;
            font-weight: 500;
            margin: 0 0 8px 0;
        }

        .recommend-section p {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            margin: 0;
        }

        .filter-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            position: relative;
        }

        .filter {
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .filter img.arrow {
            width: 12px;
            height: 12px;
            margin-left: 4px;
            position: relative;
            top: 1px;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 4px;
            background-color: #FFFFFF;
            border: 1px solid #DFDFDF;
            border-radius: 4px;
            z-index: 10;
        }

        .dropdown div {
            padding: 8px 13px;
            font-size: 11px;
            font-weight: 400;
            text-align: center;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .dropdown div.selected {
            color: #000000;
        }

        .dropdown div.dimmed {
            color: #B0B0B0;
        }

        .tab-container {
            margin-top: 14px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-container::-webkit-scrollbar {
            display: none;
        }

        .tab-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .tab {
            height: 32px;
            padding: 0 15px;
            border-radius: 16px;
            background-color: #E8E8E8;
            color: #000000;
            font-size: 14px;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tab.active {
            background-color: #36A5FF;
            color: #FFFFFF;
        }

        main {
    flex: 1 0 auto;
    display: flex;
    justify-content: center;
    align-items: flex-start; /* top 정렬 */
    text-align: center;
    min-height: 500px; /* 카드 그리드 최소 높이 지정 */
}

        @media (min-width: 768px) {
            .container {
                max-width: 720px;
                margin: 0 auto;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 960px;
            }
        }

        .card-grid {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 6px;
    padding: 20px 0;
    box-sizing: border-box;
    min-height: 500px; /* 여기서도 최소 높이 지정 */
    align-items: start;
    }

        .book-card {
            background-color: #FFFFFF;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .thumb {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #EDEDED;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 10px;
            text-align: left;
        }

        .book-title {
            font-size: 13px;
            font-weight: 500;
            margin: 0 0 4px 0;
        }

        .ar-level {
            font-size: 12px;
            color: #36A5FF;
            font-weight: 700;
        }

        .book-desc {
            font-size: 12px;
            color: #555555;
            margin-top: 6px;
            line-height: 1.4;
            white-space: pre-line;
        }

        .detail-modal {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 1000;
        }

        .detail-modal.active {
            display: block;
        }

        .detail-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
        }

        /* 모달 내용 */
        .detail-content {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 320px;
    background: #FFFFFF;
    border-radius: 10px;
    overflow: hidden;    /* 내부 스크롤 영역이 모서리 밖으로 안 나가게 */
    max-height: 90vh;  /* 화면 안에서 전체 모달 높이 제한 */
    display: flex;
    flex-direction: column;  /* 헤더+내용 세로 정렬 */
    box-sizing: border-box;
}

/* 모달 상단 고정 헤더 */
.detail-content .modal-header {
    flex: 0 0 auto;
    position: sticky;
    top: 0;
    background: #FFFFFF;
    z-index: 10;
    display: flex;
    justify-content: flex-end;
    padding: 5px 12px;
    border-bottom: 1px solid #eee;
}

/* 닫기 버튼 */
.detail-content .close-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: #000000;
}

/* 스크롤 가능 영역 */
.detail-content .modal-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px;
    box-sizing: border-box;
    /* border-radius 제거 */
}

/* 이미지 */
.detail-content .modal-body img {
    width: 100%;
    height: auto;
    object-fit: contain;
    border-radius: 8px;
    margin-bottom: 12px;
}

/* 텍스트 */
.detail-content .detail-info p {
    margin: 6px 0;
    font-size: 13px;
}


        .detail-info {
            margin-top: 12px;
            text-align: left;
            font-size: 13px;
        }

        .detail-info p {
            margin: 6px 0;
        }

    </style>
</head>
<body>
<div class="container">

    <!-- 헤더 -->
    <header>
        <a href="index.html">
            <img src="http://mecca01.hgodo.com/goods/bookmecca_logo.png" alt="로고" class="logo">
        </a>

        <div class="search-wrap">
            <img src="search.svg" class="search-icon" alt="검색">
            <input type="text" class="search-input">
        </div>        
    </header>

    <div class="recommend-section">
        <h2>추천 도서 리스트</h2>
        <p>
            미국, 영국 출판사에서 수입한 어린이 영어원서<br>
            신간 소개 및 유교전, 국제학교 베스트셀러 도서
        </p>

        <div class="filter-container">
            <div class="filter" onclick="toggleDropdown()">
                <span id="selectedFilter">AR레벨</span>
                <img id="arrowImg" class="arrow" src="arrow_down.svg" alt="▼">
            </div>
            <div class="dropdown" id="dropdown">
                <div onclick="selectFilter(this)">전체</div>
                <div onclick="selectFilter(this)">1점대</div>
                <div onclick="selectFilter(this)">2점대</div>
                <div onclick="selectFilter(this)">3점대</div>
                <div onclick="selectFilter(this)">4점대</div>
                <div onclick="selectFilter(this)">5점대</div>
                <div onclick="selectFilter(this)">6점이상</div>
            </div>
        </div>

        <div class="tab-container">
            <div class="tab active">대표도서</div>
            <div class="tab">리더스</div>
            <div class="tab">그래픽노블</div>
            <div class="tab">챕터북</div>
            <div class="tab">스토리북</div>
            <div class="tab">전체</div>
        </div>
    </div>

    <main>
        <div class="card-grid" id="cardGrid"></div>
    </main>
    
</div>

<div class="detail-modal" id="detailModal">
    <div class="detail-overlay"></div>

    <div class="detail-content">
        <!-- 고정 헤더 -->
        <div class="modal-header">
            <button class="close-btn">&times;</button>
        </div>

        <!-- 스크롤 가능한 내용 영역 -->
        <div class="modal-body">
            <img id="detailImage" src="" alt="상세 이미지">
            <div class="detail-info">
                <p><strong>ISBN</strong> <span id="detailISBN"></span></p>
                <p><strong>작가</strong> <span id="detailAuthor"></span></p>
                <p><strong>출판사</strong> <span id="detailPublisher"></span></p>
            </div>
        </div>
    </div>
</div>

<script>
    let allBooks = [];
    let currentCategory = '대표도서';  // 기본 탭
    let currentARFilter = '전체';
    
    const cardGrid = document.getElementById('cardGrid');
    const tabs = document.querySelectorAll('.tab');
    const dropdown = document.getElementById('dropdown');
    const selectedFilter = document.getElementById('selectedFilter');
    const arrowImg = document.getElementById('arrowImg');
    
    const modal = document.getElementById('detailModal');
    const detailImage = document.getElementById('detailImage');
    const detailISBN = document.getElementById('detailISBN');
    const detailAuthor = document.getElementById('detailAuthor');
    const detailPublisher = document.getElementById('detailPublisher');
    
    /* =========================
       CSV 불러오기
    ========================= */
    Papa.parse('data.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            allBooks = results.data;
            renderCards();
        }
    });
    
    /* =========================
       카드 렌더링
    ========================= */
    function renderCards() {
        // 최초 렌더링만
        if (cardGrid.childElementCount === 0) {
            allBooks.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.dataset.category = book['카테고리'];
card.dataset.ar = book['AR'] ? parseFloat(book['AR']) : '';
card.dataset.author = book['작가'] || '';
card.dataset.publisher = book['출판사'] || '';
card.dataset.isbn = book['ISBN'] || '';
card.dataset.search = book['검색어'] || '';  // 검색용

    
                card.innerHTML = `
                    <div class="thumb">
                        <img 
                            src="${book['메인']}" 
                            alt="${book['도서명']}"
                            class="detail-trigger"
                            data-detail-img="${book['상세페이지'] || ''}"
                            data-isbn="${book['ISBN'] || ''}"
                            data-author="${book['작가'] || ''}"
                            data-publisher="${book['출판사'] || ''}"
                        >
                    </div>
                    <div class="card-body">
                        <h3 class="book-title">${book['도서명']}</h3>
                        ${book['AR'] ? `<span class="ar-level">AR ${book['AR']}</span>` : ''}
                        <p class="book-desc">${book['설명'] || ''}</p>
                    </div>
                `;
                cardGrid.appendChild(card);
            });
            bindDetailEvents(); // 이벤트는 처음에만 바인딩
        }
    
        // 필터 적용 + 카드 높이 맞춤
        applyFilters();
    }
    
    /* =========================
       필터 적용 (카테고리 + AR)
    ========================= */
    function applyFilters() {
        const cards = document.querySelectorAll('.book-card');
    
        cards.forEach(card => {
            const categories = card.dataset.category ? card.dataset.category.split(',').map(c => c.trim()) : [];
            const categoryMatch = currentCategory === '전체' || categories.includes(currentCategory);
    
            let arMatch = true;
            if (currentARFilter && currentARFilter !== '전체') {
                const cardAR = parseFloat(card.dataset.ar);
                let filterMin, filterMax;
    
                if (currentARFilter === '6점이상') {
                    filterMin = 6;
                    filterMax = Infinity;
                } else {
                    filterMin = parseInt(currentARFilter, 10);
                    filterMax = filterMin + 0.9;
                }
    
                arMatch = !isNaN(cardAR) && cardAR >= filterMin && cardAR <= filterMax;
            }
    
            card.style.display = categoryMatch && arMatch ? '' : 'none';
        });
    
        fixColumnHeights(); // ✅ 필터 후 높이 맞춤
    }
    
    /* =========================
       탭 클릭 이벤트
    ========================= */
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
    
            currentCategory = tab.textContent.trim();
            applyFilters();
        });
    });
    
    /* =========================
       AR 필터
    ========================= */
    function toggleDropdown() {
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        arrowImg.src = dropdown.style.display === 'block' ? 'arrow_up.svg' : 'arrow_down.svg';
    }
    
    function selectFilter(option) {
        currentARFilter = option.textContent;
        selectedFilter.textContent = currentARFilter;
        dropdown.style.display = 'none';
        arrowImg.src = 'arrow_down.svg';
        applyFilters();
    }
    
    window.addEventListener('click', (e) => {
        if (!e.target.closest('.filter-container')) {
            dropdown.style.display = 'none';
            arrowImg.src = 'arrow_down.svg';
        }
    });
    
    /* =========================
       모달 상세보기
    ========================= */
    function bindDetailEvents() {
        document.querySelectorAll('.detail-trigger').forEach(img => {
            img.addEventListener('click', () => {
                detailImage.src = img.dataset.detailImg;
                detailISBN.textContent = img.dataset.isbn;
                detailAuthor.textContent = img.dataset.author;
                detailPublisher.textContent = img.dataset.publisher;
    
                modal.classList.add('active');
            });
        });
    }
    
    modal.addEventListener('click', (e) => {
        if (e.target.classList.contains('detail-overlay')) {
            modal.classList.remove('active');
        }
    });

    document.querySelector('.detail-content .close-btn').addEventListener('click', () => {
    modal.classList.remove('active');
});

/* =========================
   검색 기능 (엔터키 적용)
========================= */
const searchInput = document.querySelector('.search-input');
let isSearching = false; // 검색 중인지 여부

searchInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') {
        const query = searchInput.value.trim().toLowerCase();
        const cards = document.querySelectorAll('.book-card');

        if (query === '') {
            // 검색어 없으면 검색 종료, 원래 필터 적용
            isSearching = false;

            // 탭 활성화 표시 복원
            tabs.forEach(tab => tab.classList.remove('active'));
            tabs.forEach(tab => {
                if (tab.textContent.trim() === currentCategory) {
                    tab.classList.add('active');
                }
            });

            applyFilters(); // 기존 필터 적용
            return;
        }

        // 검색 시작
        isSearching = true;

        // 모든 탭 비활성화
        tabs.forEach(tab => tab.classList.remove('active'));

        cards.forEach(card => {
            const title = card.querySelector('.book-title').textContent.toLowerCase();
            const author = card.dataset.author ? card.dataset.author.toLowerCase() : '';
            const publisher = card.dataset.publisher ? card.dataset.publisher.toLowerCase() : '';
            const isbn = card.dataset.isbn ? card.dataset.isbn.toLowerCase() : '';
            const searchField = card.dataset.search ? card.dataset.search.toLowerCase() : '';

            if (
                title.includes(query) ||
                author.includes(query) ||
                publisher.includes(query) ||
                isbn.includes(query) ||
                searchField.includes(query)
            ) {
                card.style.display = ''; 
            } else {
                card.style.display = 'none';
            }
        });

        fixColumnHeights(); // 높이 맞춤
    }
});

    
    /* =========================
       열 단위 카드 높이 맞춤
    ========================= */
    function fixColumnHeights() {
        const grid = document.querySelector('.card-grid');
        const cards = Array.from(grid.children).filter(c => c.style.display !== 'none');
    
        if (!cards.length) return;
    
        // grid-template-columns 기반으로 열 개수 계산
        const style = getComputedStyle(grid);
        const gap = parseInt(style.columnGap) || 0;
        const gridWidth = grid.clientWidth;
        const colWidth = cards[0].offsetWidth;
        const cols = Math.floor((gridWidth + gap) / (colWidth + gap)) || 1;
    
        // 카드 높이 초기화
        cards.forEach(c => c.style.height = 'auto');
    
        // 열 단위로 높이 맞춤
        for (let i = 0; i < cards.length; i += cols) {
            const rowCards = cards.slice(i, i + cols);
            const maxHeight = Math.max(...rowCards.map(c => c.offsetHeight));
            rowCards.forEach(c => c.style.height = maxHeight + 'px');
        }
    }
    
    // 화면 리사이즈 시 높이 재계산
    window.addEventListener('resize', fixColumnHeights);
    
    </script>
</body>
</html>
