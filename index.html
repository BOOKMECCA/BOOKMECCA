<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>BOOKMECCA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #F6F6F6;
            font-family: 'Inter', sans-serif;
        }

        .container {
            max-width: 100%;
            width: 100%; 
            padding: 0 18px;
            box-sizing: border-box;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 0;
            margin-top: 20px;
        }

        .logo {
            width: 92px;
            height: 49px;
            object-fit: contain;
        }

        .search-wrap {
            position: relative;
            width: 176px;
            margin-top: 18px;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            pointer-events: none;
        }

        .search-input {
            width: 176px;
            height: 29px;
            padding: 4px 8px 4px 32px;
            border: 1px solid #B6D23C;
            border-radius: 14.5px;
            background-color: #FFFFFF;
            font-size: 14px;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #B6D23C;
        }

        .recommend-section {
            margin-top: 20px;
        }

        .recommend-section h2 {
            font-size: 30px;
            font-weight: 500;
            margin: 0 0 8px 0;
        }

        .recommend-section p {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            margin: 0;
        }

        .filter-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            position: relative;
        }

        .filter {
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .filter img.arrow {
            width: 12px;
            height: 12px;
            margin-left: 4px;
            position: relative;
            top: 1px;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 4px;
            background-color: #FFFFFF;
            border: 1px solid #DFDFDF;
            border-radius: 4px;
            z-index: 10;
        }

        .dropdown div {
            padding: 8px 13px;
            font-size: 11px;
            font-weight: 400;
            text-align: center;
            cursor: pointer;
            margin-bottom: 6px;
        }

        .dropdown div.selected {
            color: #000000;
        }

        .dropdown div.dimmed {
            color: #B0B0B0;
        }

        .tab-container {
            margin-top: 14px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-container::-webkit-scrollbar {
            display: none;
        }

        .tab-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .tab {
            height: 32px;
            padding: 0 15px;
            border-radius: 16px;
            background-color: #E8E8E8;
            color: #000000;
            font-size: 15px;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .tab.active {
            background-color: #36A5FF;
            color: #FFFFFF;
        }

        main {
            flex: 1 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: stretch;
            text-align: center;
            min-height: 500px;
            position: relative;
            flex-direction: column;
        }

        #noResultsMsg {
            display: none;
            position: fixed;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #555555;
            text-align: center;
            z-index: 100;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 720px;
                margin: 0 auto;
            }
        }

        @media (min-width: 1024px) {
            .container {
                max-width: 960px;
            }
        }

        .card-grid {
            width: 100%;
            display: grid;
            margin-top: 14px;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            column-gap: 8px;
            row-gap: 8px;
            box-sizing: border-box;
            align-items: start;
        }

        @media (min-width: 600px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* =========================
           카드 구조 수정
        ========================= */
        .book-card {
            display: flex;
            flex-direction: row;
            gap: 15px;
            background-color: #FFFFFF;
            border-radius: 12px;
            overflow: hidden;
            height: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .thumb-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 120px;
        }

        .body-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            flex: 1;
        }

        .book-card .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-card .card-body {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .book-title {
            font-size: 14px;
            font-weight: 500;
            margin: 0 0 4px 0;
        }

        .ar-level {
            font-size: 13px;
            color: #36A5FF;
            font-weight: 700;
        }

        .book-desc {
            font-size: 13px;
            color: #555555;
            margin-top: 6px;
            line-height: 1.4;
            white-space: pre-line;
        }

        .detail-modal {
            position: fixed;
            inset: 0;
            display: none;
            z-index: 1000;
        }

        .detail-modal.active {
            display: block;
        }

        .detail-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
        }

        .detail-content {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 320px;
            background: #FFFFFF;
            border-radius: 10px;
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .detail-content .modal-header {
            flex: 0 0 auto;
            position: sticky;
            top: 0;
            background: #FFFFFF;
            z-index: 10;
            display: flex;
            justify-content: flex-end;
            padding: 3px 12px;
        }

        .detail-content .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #000000 !important;
            -webkit-appearance: none;
            appearance: none;
            padding: 0;
            line-height: 1;
        }

        .detail-content .modal-body {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 12px;
            box-sizing: border-box;
        }

        .detail-content .modal-body img {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .detail-info {
            margin-top: 12px;
            text-align: left;
            font-size: 13px;
            padding-right: 10px;
            padding-left: 10px;
        }

        .detail-info p {
            margin: 6px 0;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 헤더 -->
    <header>
        <a href="index.html">
            <img src="http://mecca01.hgodo.com/goods/bookmecca_logo.png" alt="로고" class="logo">
        </a>

        <div class="search-wrap">
            <img src="search.svg" class="search-icon" alt="검색">
            <input type="text" class="search-input">
        </div>        
    </header>

    <div class="recommend-section">
        <h2>추천 도서 리스트</h2>
        <p>
            미국, 영국 출판사에서 수입한 어린이 영어원서<br>
            신간 소개 및 유교전, 국제학교 베스트셀러 도서
        </p>

        <div class="filter-container">
            <div class="filter" onclick="toggleDropdown()">
                <span id="selectedFilter">AR레벨</span>
                <img id="arrowImg" class="arrow" src="arrow_down.svg" alt="▼">
            </div>
            <div class="dropdown" id="dropdown">
                <div onclick="selectFilter(this)">전체</div>
                <div onclick="selectFilter(this)">1점대</div>
                <div onclick="selectFilter(this)">2점대</div>
                <div onclick="selectFilter(this)">3점대</div>
                <div onclick="selectFilter(this)">4점대</div>
                <div onclick="selectFilter(this)">5점대</div>
                <div onclick="selectFilter(this)">6점이상</div>
            </div>
        </div>

        <div class="tab-container">
            <div class="tab active">대표도서</div>
            <div class="tab">리더스</div>
            <div class="tab">그래픽노블</div>
            <div class="tab">챕터북</div>
            <div class="tab">스토리북</div>
            <div class="tab">전체</div>
        </div>
    </div>

   <main>
    <div class="card-grid" id="cardGrid"></div>
</main>

<p id="noResultsMsg">
    검색 결과가 없습니다.
</p>

    
</div>

<div class="detail-modal" id="detailModal">
    <div class="detail-overlay"></div>

    <div class="detail-content">
        <div class="modal-header">
            <button class="close-btn">&times;</button>
        </div>

        <div class="modal-body">
            <img id="detailImage" src="" alt="상세 이미지">
            <div id="detailImagePlaceholder" style="display:none; text-align:center; padding:20px; color:#555;">
                이미지 준비중입니다.
            </div>
            <div class="detail-info">
                <p><strong>ISBN</strong> <span id="detailISBN"></span></p>
                <p><strong>작가</strong> <span id="detailAuthor"></span></p>
                <p><strong>출판사</strong> <span id="detailPublisher"></span></p>
            </div>
        </div>

<script>
let allBooks = [];
let currentCategory = '대표도서';  
let currentARFilter = '전체';

const cardGrid = document.getElementById('cardGrid');
const tabs = document.querySelectorAll('.tab');
const dropdown = document.getElementById('dropdown');
const selectedFilter = document.getElementById('selectedFilter');
const arrowImg = document.getElementById('arrowImg');

const modal = document.getElementById('detailModal');
const detailImage = document.getElementById('detailImage');
const detailISBN = document.getElementById('detailISBN');
const detailAuthor = document.getElementById('detailAuthor');
const detailPublisher = document.getElementById('detailPublisher');

/* =========================
   CSV 불러오기
========================= */
Papa.parse('data.csv', {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
        allBooks = results.data;
        renderCards();
    }
});

/* =========================
   카드 렌더링 (wrapper 구조 적용)
========================= */
function renderCards() {
    if (cardGrid.childElementCount === 0) {
        allBooks.forEach(book => {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.dataset.category = book['카테고리'];
            card.dataset.ar = book['AR'] || '';
            card.dataset.author = book['작가'] || '';
            card.dataset.publisher = book['출판사'] || '';
            card.dataset.isbn = book['ISBN'] || '';
            card.dataset.search = book['검색어'] || '';

            card.innerHTML = `
                <div class="thumb-wrapper">
                    <div class="thumb">
                        <img 
                            src="${book['메인']}" 
                            alt="${book['도서명']}"
                            class="detail-trigger"
                            data-detail-img="${book['상세페이지'] || ''}"
                            data-isbn="${book['ISBN'] || ''}"
                            data-author="${book['작가'] || ''}"
                            data-publisher="${book['출판사'] || ''}"
                        >
                    </div>
                </div>
                <div class="body-wrapper">
                    <div class="card-body">
                        <h3 class="book-title">${book['도서명']}</h3>
                        ${book['AR'] ? `<span class="ar-level">AR ${book['AR']}</span>` : ''}
                        <p class="book-desc">${book['설명'] || ''}</p>
                    </div>
                </div>
            `;
            cardGrid.appendChild(card);
        });
        bindDetailEvents();
    }

    applyFilters();
}

/* =========================
   필터 적용
========================= */
function applyFilters() {
    const cards = document.querySelectorAll('.book-card');

    cards.forEach(card => {
        const categories = card.dataset.category ? card.dataset.category.split(',').map(c => c.trim()) : [];
        const categoryMatch = currentCategory === '전체' || categories.includes(currentCategory);

        let arMatch = true;

if (currentARFilter && currentARFilter !== '전체') {
    const arText = (card.dataset.ar || '').trim();

    // AR 값이 없으면 필터 탈락
    if (!arText) {
        arMatch = false;
    } else {
        let minAR, maxAR;

        if (arText.includes('~')) {
            const parts = arText.split('~').map(v => parseFloat(v));
            minAR = parts[0];
            maxAR = parts[1];
        } else {
            minAR = maxAR = parseFloat(arText);
        }

        let filterMin, filterMax;

        if (currentARFilter === '6점이상') {
            filterMin = 6;
            filterMax = Infinity;
        } else {
            filterMin = parseInt(currentARFilter, 10);
            filterMax = filterMin + 0.9;
        }

        // 범위 겹침 체크
        arMatch =
            !isNaN(minAR) &&
            !isNaN(maxAR) &&
            maxAR >= filterMin &&
            minAR <= filterMax;
    }
}



        card.style.display = categoryMatch && arMatch ? '' : 'none';
    });

    fixColumnHeights();
}

/* =========================
   탭 이벤트
========================= */
tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        currentCategory = tab.textContent.trim();

        searchInput.value = '';
        document.getElementById('noResultsMsg').style.display = 'none';

        applyFilters();
    });
});

/* =========================
   AR 필터
========================= */
function toggleDropdown() {
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    arrowImg.src = dropdown.style.display === 'block' ? 'arrow_up.svg' : 'arrow_down.svg';
}

function selectFilter(option) {
    // 선택한 필터 값 저장
    currentARFilter = option.textContent;
    selectedFilter.textContent = currentARFilter;

    // 드롭다운 숨기기
    dropdown.style.display = 'none';
    arrowImg.src = 'arrow_down.svg';

    // 모든 옵션을 비활성화 상태로 초기화
    const options = dropdown.querySelectorAll('div');
    options.forEach(opt => {
        if (opt.textContent === currentARFilter) {
            opt.classList.add('selected');   // 선택된 항목 강조
            opt.classList.remove('dimmed');
        } else {
            opt.classList.remove('selected');
            opt.classList.add('dimmed');     // 나머지는 회색
        }
    });

    // 카드 필터 적용
    applyFilters();
}

// 초기 드롭다운 상태도 회색 처리
document.addEventListener('DOMContentLoaded', () => {
    const options = dropdown.querySelectorAll('div');
    options.forEach(opt => opt.classList.add('dimmed'));
});


window.addEventListener('click', (e) => {
    if (!e.target.closest('.filter-container')) {
        dropdown.style.display = 'none';
        arrowImg.src = 'arrow_down.svg';
    }
});

/* =========================
   모달 상세보기
========================= */
function bindDetailEvents() {
    document.querySelectorAll('.book-card').forEach(card => {
        card.addEventListener('click', () => {
            const img = card.querySelector('.thumb img');

            // 이미지 처리 (기존 코드)
            const detailImgUrl = img.dataset.detailImg;
            if (detailImgUrl) {
                detailImage.src = detailImgUrl;
                detailImage.style.display = 'block';
                document.getElementById('detailImagePlaceholder').style.display = 'none';
            } else {
                detailImage.style.display = 'none';
                document.getElementById('detailImagePlaceholder').style.display = 'block';
            }

            // 값 세팅
            detailISBN.textContent = img.dataset.isbn;
            detailAuthor.textContent = img.dataset.author;
            detailPublisher.textContent = img.dataset.publisher;

            // 작가 클릭 시 검색
detailAuthor.onclick = () => {
    searchInput.value = img.dataset.author;
    searchInput.dispatchEvent(
        new KeyboardEvent('keydown', { key: 'Enter' })
    );
    modal.classList.remove('active');
};

// 출판사 클릭 시 검색
detailPublisher.onclick = () => {
    searchInput.value = img.dataset.publisher;
    searchInput.dispatchEvent(
        new KeyboardEvent('keydown', { key: 'Enter' })
    );
    modal.classList.remove('active');
};

            modal.classList.add('active');
        });
    });
}


modal.addEventListener('click', (e) => {
    if (e.target.classList.contains('detail-overlay')) {
        modal.classList.remove('active');
    }
});

document.querySelector('.detail-content .close-btn').addEventListener('click', () => {
    modal.classList.remove('active');
});

/* =========================
   검색 기능 (Enter 눌렀을 때만)
========================= */
const searchInput = document.querySelector('.search-input');

searchInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;

    // 검색 시 탭 전부 비활성화
    tabs.forEach(t => t.classList.remove('active'));
    currentCategory = '전체';

    const query = e.target.value.toLowerCase().trim();
    const cards = document.querySelectorAll('.book-card');
    let anyVisible = false;

    cards.forEach(card => {
        const search = card.dataset.search.toLowerCase();
        const title = card.querySelector('.book-title').textContent.toLowerCase();
        const author = card.dataset.author.toLowerCase();
        const publisher = card.dataset.publisher.toLowerCase();

        const match =
            search.includes(query) ||
            title.includes(query) ||
            author.includes(query) ||
            publisher.includes(query);

        card.style.display = match ? '' : 'none';
        if (match) anyVisible = true;
    });

    document.getElementById('noResultsMsg').style.display =
        anyVisible ? 'none' : 'block';

    setTimeout(fixColumnHeights, 50);
});


/* =========================
   카드 높이 정렬
========================= */
function fixColumnHeights() {
    const cards = Array.from(document.querySelectorAll('.book-card'));
    if (!cards.length) return;

    // 모바일 1열이면 높이 초기화 후 종료
    if (window.innerWidth < 600) {
        cards.forEach(card => card.style.height = 'auto');
        return;
    }

    // row 단위로 그룹화
    const rows = [];
    cards.forEach(card => {
        const top = card.offsetTop;
        let row = rows.find(r => Math.abs(r.top - top) < 5); // offsetTop 오차 고려
        if (!row) {
            row = { top, cards: [] };
            rows.push(row);
        }
        row.cards.push(card);
    });

    // 각 row 안에서 높이 맞춤
    rows.forEach(row => {
        let maxHeight = 0;
        row.cards.forEach(card => {
            card.style.height = 'auto'; // 기존 높이 초기화
            maxHeight = Math.max(maxHeight, card.offsetHeight);
        });
        row.cards.forEach(card => {
            card.style.height = maxHeight + 'px';
        });
    });
}




window.addEventListener('resize', fixColumnHeights);

</script>
</body>
</html>
